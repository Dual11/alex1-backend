version: '3.8'
services:
  db:
    image: postgres:15
    container_name: db-watch
    environment:
      POSTGRES_DB: watch
      POSTGRES_USER: user
      POSTGRES_PASSWORD: 1234
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
